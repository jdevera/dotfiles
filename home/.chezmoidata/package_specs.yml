# yaml-language-server: $schema=./.package_specs.schema.yml
---
# Software package specs, heavily inspired by InstallDoctor:
# https://install.doctor/docs/customization/software
#
# This file is not meant to be a list of what gets installed, but rather
# how to install the packages that are requested elsewhere.
softwarePackages:
  tox:
    uv:
      name: tox
      with: tox-uv
  claude-code:
    check:
      command: claude
    script: >-
      curl -fsSL https://claude.ai/install.sh | bash
  colout:
    uv: colout
  bash:
    brew: bash
    apt: bash
    dnf: bash
  bat:
    brew: bat
    apt: bat
    dnf: bat
  bubblewrap:
    description: Unprivileged Linux sandboxing tool (bwrap); used by Codex and Flatpak
    homepage: https://github.com/containers/bubblewrap
    apt: bubblewrap
    dnf: bubblewrap
  curl:
    brew: curl
    apt: curl
    dnf: curl
  fd:
    brew: fd
    apt: fd-find
    dnf: fd-find
  fzf:
    brew: fzf
    apt: fzf
    dnf: fzf
  gh:
    brew: gh
    dnf: gh
  git:
    brew: git
    apt: git
    dnf: git
  git-delta:
    brew: git-delta
    apt: git-delta
    dnf: git-delta
  jq:
    brew: jq
    apt: jq
    dnf: jq
  mise:
    description: Polyglot tool/runtime version manager (Node, Python, etc.)
    homepage: https://mise.jdx.dev
    brew: mise
    dnf:
      package: mise
      repo: https://mise.jdx.dev/rpm/mise.repo
  prek:
    description: Fast Rust pre-commit alternative (git hook manager)
    homepage: https://github.com/j178/prek
    brew: prek
    check:
      command: prek
    mise: aqua:j178/prek
  ripgrep:
    brew: ripgrep
    apt: ripgrep
    dnf: ripgrep
  rsync:
    brew: rsync
    apt: rsync
    dnf: rsync
  starship:
    brew: starship
    apt: starship
    dnf:
      package: starship
      copr: atim/starship
  tig:
    brew: tig
    apt: tig
    dnf: tig
  tmux:
    brew: tmux
    apt: tmux
    dnf: tmux
  tree:
    brew: tree
    apt: tree
    dnf: tree
  uv:
    brew: uv
    apt: uv
    dnf: uv
    check:
      command: uv
    script: >-
      sh -c "$(curl -LsSf https://astral.sh/uv/install.sh )" --no-modify-path
  wget:
    brew: wget
    apt: wget
    dnf: wget
  tag:
    brew: tag
  macvim:
    cask: macvim-app
  vim:
    apt: vim
    dnf: vim-enhanced
  nf-fantasque-sans-mono:
    cask: font-fantasque-sans-mono-nerd-font
  yq:
    homepage: https://github.com/mikefarah/yq
    brew: yq
    check:
      command: yq
    mise: aqua:mikefarah/yq
  hishtory:
    homepage: https://github.com/ddworken/hishtory
    brew: hishtory
    check:
      command: hishtory
    mise: github:ddworken/hishtory
  vscode:
